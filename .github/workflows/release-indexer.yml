# Build the static Linux x86_64 indexer for Vercel Sandbox.
#
# - workflow_dispatch: build + verify + upload Actions artifact only (no GitHub Release).
# - push of tag indexer-v*: same build, then create a GitHub Release with the binary and checksum.
#
# Canonical build (matches docker/Dockerfile and packages/workspace/test/sandbox.test.ts):
#   cargo zigbuild --locked --release -p sandchest-indexer --target x86_64-unknown-linux-musl
name: Release indexer

on:
  workflow_dispatch:
  push:
    tags:
      - "indexer-v*"

# Default: read-only. The release job opts into contents: write.
permissions:
  contents: read

concurrency:
  group: release-indexer-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: sandchest-index
  TARGET: x86_64-unknown-linux-musl
  ZIG_VERSION: "0.13.0"

jobs:
  build:
    name: Build musl indexer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Rust (stable + musl target)
        # dtolnay/rust-toolchain@stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install Zig
        # mlugg/setup-zig@v2.2.1
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install cargo-zigbuild
        # taiki-e/install-action@v2.90.0
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: cargo-zigbuild@0.24.0

      - name: Build sandchest-index (linux musl)
        run: cargo zigbuild --locked --release -p sandchest-indexer --target "${TARGET}"

      - name: Verify binary (exists, ELF x86_64, static)
        run: |
          set -euo pipefail
          bin="target/${TARGET}/release/${BIN_NAME}"
          test -f "$bin"
          test -x "$bin"
          info="$(file -b "$bin")"
          echo "file: $info"
          echo "$info" | grep -q 'ELF 64-bit LSB'
          echo "$info" | grep -Eq 'x86-64|x86_64'
          echo "$info" | grep -qi 'static'
          # Static musl binaries have no PT_INTERP (no dynamic loader).
          if readelf -l "$bin" | grep -q 'Requesting program interpreter'; then
            echo "error: binary requests a dynamic interpreter (not statically linked)" >&2
            readelf -l "$bin" | grep -A1 INTERP || true
            exit 1
          fi
          # Stage release assets with stable names for artifact / release upload.
          mkdir -p dist
          cp -f "$bin" "dist/${BIN_NAME}"
          chmod 755 "dist/${BIN_NAME}"
          (
            cd dist
            sha256sum "${BIN_NAME}" > "${BIN_NAME}.sha256"
            sha256sum -c "${BIN_NAME}.sha256"
          )
          echo "SHA-256:"
          cat "dist/${BIN_NAME}.sha256"

      - name: Upload Actions artifact
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sandchest-index-linux-x86_64-musl
          path: |
            dist/sandchest-index
            dist/sandchest-index.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    # Tag pushes only — never on workflow_dispatch, even if the ref is a tag.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/indexer-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        # actions/download-artifact@v4.2.1
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: sandchest-index-linux-x86_64-musl
          path: dist

      - name: Re-verify checksum
        run: |
          set -euo pipefail
          cd dist
          test -f sandchest-index
          test -f sandchest-index.sha256
          sha256sum -c sandchest-index.sha256

      - name: Create release (fail if tag release already exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Refuse to clobber an existing release or its assets.
          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "error: GitHub Release for ${tag} already exists; refusing to overwrite" >&2
            exit 1
          fi
          sha="$(cut -d' ' -f1 dist/sandchest-index.sha256)"
          notes="$(printf '%s\n' \
            "Static Linux x86_64 musl build of \`sandchest-index\` for Vercel Sandbox." \
            "" \
            "Set on the web deployment:" \
            "" \
            "\`\`\`" \
            "SANDCHEST_INDEXER_LINUX_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/sandchest-index" \
            "SANDCHEST_INDEXER_LINUX_SHA256=${sha}" \
            "\`\`\`")"
          gh release create "$tag" \
            dist/sandchest-index \
            dist/sandchest-index.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$tag" \
            --notes "$notes"
